model_fp: ???
input_dir: ???
labels_fp: ???
output_dir: "linear_prob_features"
# features are written as a directory of parquet files, <output_dir>/<output_fn>/part-*.parquet
output_fn: null # defaults to "features"
chunk_size: 10000 # rows per parquet file, bounds memory use

# if true, mean-pool hidden states across the whole context window instead of taking the
# last token's hidden state
average_over_sequence: false

device: "cuda" # "cuda" or "cpu"
# every example has a different sequence length, so torch.compile would keep recompiling
no_compile: true

hydra:
  output_subdir: null
