task: ???
model_fp: ???
input_dir: ???
output_dir: "results"
output_fn: null

temperature: 1.0

dataset_kwargs: null # dataset_kwargs.{arg_name}={arg_value}, it is passed to the dataset constructor
subset: null # subset of the dataset to use for inference < 1 is fraction, >= 1 is the number of samples
rep_num: 1
save_generated_tokens: false
max_new_tokens: null # stop a generation after this many tokens, whatever happened (null: no limit)
# Generate with a cache of keys and values instead of computing the whole window for every token.
# When the window is full it slides by kv_slide tokens and the rest of it is computed again
# (e.g. 256 for a 2048 window). null: no cache, exact but slow. Decoder-only models only.
kv_slide: null
batch_labels: 1 # labels generated together when their timelines have the same length

device: "cuda" # "cuda" or "cpu"
n_jobs: 1 # jobs per cpu or per gpu
n_gpus: 1
no_compile: false # compilation might not work on older systems

result_chunk_size: 128000
chunksize: 1
timeout: 300

seed: 42

hydra:
  output_subdir: null
